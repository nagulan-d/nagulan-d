  <path d="M72 56H1128V304H72Z" fill="none" stroke="#00A884" stroke-width="2"/>
  <path d="M72 104V56H220 M980 56H1128V104 M72 256V304H220 M980 304H1128V256" fill="none" stroke="#72F2C0" stroke-width="4" stroke-linecap="square"/>
