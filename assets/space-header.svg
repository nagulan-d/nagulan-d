  <text x="600" y="158" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" text-anchor="middle" letter-spacing=".5">Nagulan D</text>
  <path d="M490 181H710" stroke="#00A884" stroke-width="3"/>
  <text x="600" y="220" fill="#72F2C0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="1">PYTHON  •  GENERATIVE AI  •  SOFTWARE DEVELOPMENT</text>
  <text x="600" y="257" fill="#D5E7E0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">Building practical software and exploring intelligent solutions.</text>
