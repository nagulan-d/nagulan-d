<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nagulan D — Python, Generative AI, Software Development</title>
  <desc id="desc">Charcoal banner with a geometric emerald frame and mint typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#111F22"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006B52"/>
      <stop offset="100%" stop-color="#00A884"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="8" fill="url(#bg)"/>
  <!-- geometric corner accents -->
  <path d="M0 0H330L280 42H42V112L0 152Z" fill="#006B52" opacity=".95"/>
  <path d="M0 0H250L214 28H28V92L0 120Z" fill="#00A884" opacity=".8"/>
